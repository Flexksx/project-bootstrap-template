$schema: 'https://moonrepo.dev/schemas/v2/template.json'

title: 'Frontend application'
description: 'pnpm workspace member. SvelteKit or Nuxt, with Biome.'
destination: 'apps/[name]'

variables:
  name:
    type: 'string'
    required: true
    order: 1
    prompt: 'Name (kebab-case)'
  description:
    type: 'string'
    default: ''
    order: 2
    prompt: 'One-line description'
  framework:
    type: 'enum'
    values: ['sveltekit', 'nuxt']
    default: 'sveltekit'
    order: 3
    prompt: 'SvelteKit or Nuxt?'
