[project]
name = "{{ name }}"
version = "0.1.0"
description = "{{ description }}"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.9", "ty>=0.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ name | snake_case }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
