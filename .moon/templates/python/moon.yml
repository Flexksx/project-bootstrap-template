$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'python'
tags: ['python']
{% if kind == "app" %}layer: 'application'
stack: 'backend'{% else %}layer: 'library'{% endif %}

project:
  description: '{{ description }}'
{% if kind == "app" %}
tasks:
  start:
    command: 'uv run python -m {{ name | snake_case }}'
    toolchains: 'system'
    options:
      cache: false
      persistent: true
{% endif %}
