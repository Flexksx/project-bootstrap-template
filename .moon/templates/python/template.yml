$schema: 'https://moonrepo.dev/schemas/v2/template.json'

title: 'Python unit'
description: 'moon wiring for a unit that `uv init` creates. Run `just new python`.'
destination: '[kind]s/[name]'

variables:
  name:
    type: 'string'
    required: true
    order: 1
    prompt: 'Name (kebab-case)'
  kind:
    type: 'enum'
    values: ['lib', 'app']
    default: 'lib'
    order: 2
    prompt: 'Library or application?'
